<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DISTO Rilievo</title>
<style>
  :root {
    --bg:#0b0b0d; --panel:#15151a; --panel2:#1d1d24; --line:#2b2b33; --fg:#f3f3f5; --muted:#9a9aa5;
    --accent:#e5383b; --accent2:#ff5c5f; --accentbg:rgba(229,56,59,.14);
    --ok:#4ade80; --bad:#ff4d4f; --warn:#ffb020;
    color-scheme: dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { padding:calc(8px + env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom)); max-width:1400px; margin:0 auto; -webkit-user-select:none; user-select:none; }
  button { font:inherit; font-weight:650; color:var(--fg); background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-height:48px; touch-action:manipulation; cursor:pointer; }
  button:active { transform:scale(.97); background:#26262e; }
  button:disabled { opacity:.4; }
  button.red { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.red:active { background:#c42a2d; }

  /* intestazione */
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0 10px; background:var(--bg); }
  .brand { display:flex; align-items:baseline; gap:6px; font-size:20px; font-weight:800; letter-spacing:.3px; }
  .brand b { color:var(--accent); }
  .brand span { color:var(--muted); font-weight:600; font-size:15px; }
  #bConn { display:flex; align-items:center; gap:8px; border-radius:999px; padding:8px 16px; min-height:44px; }
  #bConn::before { content:""; width:10px; height:10px; border-radius:50%; background:#fff; opacity:.85; }
  #bConn.on { background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.5); color:var(--ok); }
  #bConn.on::before { background:var(--ok); box-shadow:0 0 0 4px rgba(74,222,128,.2); }

  /* istruzione corrente */
  #hintCard { background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  #hintCard.flash-ok { animation:fok .7s ease-out; }
  #hintCard.flash-bad { animation:fbad .9s ease-out; }
  @keyframes fok { 0% { background:rgba(74,222,128,.35); border-left-color:var(--ok); } 100% { background:var(--panel); } }
  @keyframes fbad { 0%,30% { background:rgba(255,77,79,.4); } 100% { background:var(--panel); } }
  #hint { font-weight:750; font-size:18px; line-height:1.3; color:var(--fg); }
  #status { color:var(--muted); min-height:1.3em; margin-top:6px; font-size:15px; }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); font-weight:650; }
  #summary { font-weight:650; color:var(--accent2); min-height:1.2em; margin-top:4px; font-size:14px; }

  /* modalità */
  #modes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  #modes button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:60px; padding:8px 4px; line-height:1.1; }
  #modes button small { font-size:11.5px; font-weight:500; color:var(--muted); }
  #modes button.on { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 18px rgba(229,56,59,.35); }
  #modes button.on small { color:rgba(255,255,255,.85); }
  @media (min-width:700px) { #modes { grid-template-columns:repeat(6,1fr); } }

  /* pianta e dati */
  #wrap { display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:900px) { #wrap { grid-template-columns:1fr 360px; } }
  .cvbox { position:relative; }
  canvas { width:100%; height:52vh; min-height:300px; border:1px solid var(--line); border-radius:14px; background:#101014; display:block; touch-action:none; }
  #bFit { position:absolute; right:10px; top:10px; min-height:38px; padding:6px 12px; border-radius:999px; background:rgba(29,29,36,.92); font-size:14px; }
  .cvtip { position:absolute; left:12px; bottom:8px; font-size:11.5px; color:var(--muted); pointer-events:none; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  #stationCard { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  #stationCard .field { display:flex; align-items:center; gap:8px; flex:1 1 100%; }
  #stationCard label { color:var(--muted); font-size:14px; }
  #stlabel { margin-left:auto; font-weight:700; color:var(--warn); font-size:14px; background:rgba(255,176,32,.12); border:1px solid rgba(255,176,32,.35); padding:4px 10px; border-radius:999px; }
  #bStation { flex:1 1 0; border-color:rgba(255,176,32,.55); color:var(--warn); }
  #bSkip { flex:1 1 0; }
  input[type=text] { font:inherit; font-weight:700; width:96px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); text-align:center; -webkit-user-select:text; user-select:text; }
  input[type=text]:focus { outline:2px solid var(--accent); border-color:transparent; }

  details { background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  details summary { padding:12px 14px; font-weight:700; cursor:pointer; list-style:none; display:flex; justify-content:space-between; }
  details summary::after { content:"▾"; color:var(--muted); }
  details[open] summary::after { content:"▴"; }
  pre { margin:0; padding:4px 14px 14px; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; overflow:auto; max-height:52vh; white-space:pre; color:#d8d8de; -webkit-user-select:text; user-select:text; }

  /* barra in basso */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(11,11,13,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  #bar .in { max-width:1400px; margin:0 auto; display:grid; grid-template-columns:1.3fr 1fr 1fr .7fr; gap:8px; }
  #bar button { min-height:54px; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; line-height:1.1; padding:6px 4px; }
  #bar button i { font-style:normal; font-size:19px; line-height:1; }

  /* menu */
  #sheet { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; }
  #sheet[hidden] { display:none; }
  #sheet .panel { width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #sheet h3 { margin:2px 4px 10px; font-size:15px; color:var(--muted); font-weight:600; }
  #sheet .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #sheet .grid button { min-height:52px; text-align:left; }
  #sheet .grid button.wide { grid-column:1 / -1; }
  #bClear { color:var(--bad); border-color:rgba(255,77,79,.45); }
  #sheet .ver { color:var(--muted); font-size:12px; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>DISTO</b> Rilievo <span id="stlabelTop"></span></div>
  <button id="bConn">Collega Disto</button>
</header>

<div id="hintCard">
  <div id="hint"></div>
  <div id="status">Non collegato</div>
  <div id="summary"></div>
</div>

<div id="modes"></div>

<div id="wrap">
  <div>
    <div class="cvbox">
      <canvas id="cv"></canvas>
      <button id="bFit" hidden>⤢ Adatta</button>
      <div class="cvtip">Due dita: zoom · Un dito: sposta · Doppio tocco: adatta</div>
    </div>
    <div id="stationCard" class="card">
      <div class="field">
        <label for="hvar">Altezza strumento</label>
        <input id="hvar" type="text" inputmode="decimal" autocomplete="off" placeholder="m">
        <span id="stlabel"></span>
      </div>
      <button id="bStation">Nuova stazione</button>
      <button id="bSkip" disabled>Salta riferimento</button>
    </div>
  </div>
  <details id="dati">
    <summary>Dati misurati</summary>
    <pre id="lst"></pre>
  </details>
</div>

<nav id="bar"><div class="in">
  <button id="bUndo" class="red"><i>↶</i>Annulla</button>
  <button id="bClose"><i>⬠</i>Chiudi</button>
  <button id="bRoom"><i>＋</i>Stanza</button>
  <button id="bMenu"><i>☰</i>Menu</button>
</div></nav>

<div id="sheet" hidden>
  <div class="panel">
    <h3>Rilievo</h3>
    <div class="grid">
      <button id="bDxf">⬇ Esporta DXF</button>
      <button id="bSave">💾 Salva rilievo</button>
      <button id="bOpen">📂 Apri rilievo</button>
      <button id="bSound">🔊 Suono: sì</button>
      <button id="bAll" class="wide">Collega: mostra tutti i dispositivi</button>
      <button id="bDemo">Prova (demo)</button>
      <button id="bClear">Azzera tutto</button>
      <button id="bSheetClose" class="wide red">Chiudi menu</button>
    </div>
    <div class="ver">DISTO Rilievo · versione 2 · 27/10/2026</div>
  </div>
</div>
<input id="fileIn" type="file" accept=".json,application/json" hidden>

<script>
"use strict";
const SERVICE = "3ab10100-f831-4395-b29d-570977d5bf94";
const U = n => "3ab10" + n + "-f831-4395-b29d-570977d5bf94";
const ENABLE = ["10d","10f","110","111","112","121","122"];
const MODES = [["plan","Pianta","spigoli a quota 0"],["floor","Pavimento","h strumento"],["ceil","Soffitto","altezza stanza"],["window","Finestra","4 punti"],["door","Porta","3 punti"],["refs","Riferimenti","per le stazioni"]];
const WSTEPS = ["FINESTRA 1/4 — punta lo spigolo SINISTRO","FINESTRA 2/4 — punta lo spigolo DESTRO","FINESTRA 3/4 — punta il DAVANZALE (parapetto)","FINESTRA 4/4 — punta il bordo ALTO"];
const DSTEPS = ["PORTA 1/3 — punta lo spigolo SINISTRO","PORTA 2/3 — punta lo spigolo DESTRO","PORTA 3/3 — punta il bordo ALTO"];
const HINTS = {floor:"PAVIMENTO — punta un punto sul pavimento: ricavo l'altezza dello strumento", ceil:"SOFFITTO — punta un punto sul soffitto (es. spigolo alto)"};
const $ = id => document.getElementById(id);

/* ---------- stato ---------- */
const newRoom = () => ({pts:[], closed:false});
const newStation = () => ({theta:0, t:[0,0], tz:0, res:null});
let S = {rooms:[newRoom()], ceil:[], open:[], refs:[], stations:[newStation()], hvar:""};
let stat = null, partial = null, undo = [], mode = "plan";

/* ---------- geometria ---------- */
const dist2 = (a,b) => Math.hypot(b[0]-a[0], b[1]-a[1]);
function proj(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], l2=dx*dx+dy*dy; if(!l2) return a;
  const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2)); return [a[0]+t*dx, a[1]+t*dy]; }
function areaM2(pts){ let s=0; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s)/2/1e6; }
function inside(pt,poly){ let res=false; const [x,y]=pt;
  for(let i=0;i<poly.length;i++){ const [x1,y1]=poly[i], [x2,y2]=poly[(i+1)%poly.length];
    if((y1>y)!==(y2>y) && x < (x2-x1)*(y-y1)/(y2-y1)+x1) res=!res; } return res; }
function toXYZ(m){ const d=m.d*1000, r=d*Math.sin(m.z), h=-m.h; return [r*Math.cos(h), r*Math.sin(h), d*Math.cos(m.z)]; }
function solveStation(pairs){
  const n=pairs.length; let lcx=0,lcy=0,gcx=0,gcy=0;
  for(const [l,g] of pairs){ lcx+=l[0]; lcy+=l[1]; gcx+=g[0]; gcy+=g[1]; }
  lcx/=n; lcy/=n; gcx/=n; gcy/=n; let sd=0, sc=0;
  for(const [l,g] of pairs){ const lx=l[0]-lcx, ly=l[1]-lcy, gx=g[0]-gcx, gy=g[1]-gcy; sd+=lx*gx+ly*gy; sc+=lx*gy-ly*gx; }
  const th=Math.atan2(sc,sd), c=Math.cos(th), s=Math.sin(th);
  const tx=gcx-(c*lcx-s*lcy), ty=gcy-(s*lcx+c*lcy);
  const tz=pairs.reduce((a,[l,g])=>a+g[2]-l[2],0)/n;
  const res=pairs.map(([l,g])=>Math.sqrt((c*l[0]-s*l[1]+tx-g[0])**2+(s*l[0]+c*l[1]+ty-g[1])**2+(l[2]+tz-g[2])**2));
  return {theta:th, t:[tx,ty], tz, res};
}
function apply(p){ const s=S.stations[S.stations.length-1], c=Math.cos(s.theta), sn=Math.sin(s.theta);
  return [c*p[0]-sn*p[1]+s.t[0], sn*p[0]+c*p[1]+s.t[1], p[2]+s.tz]; }
function tf(p){ const flat=[]; for(const r of S.rooms) for(const q of r.pts) flat.push(q.p);
  if(!flat.length) return [p[0],p[1]]; const o=flat[0];
  if(flat.length<2) return [p[0]-o[0], p[1]-o[1]];
  const th=Math.atan2(flat[1][1]-o[1], flat[1][0]-o[0]), c=Math.cos(-th), s=Math.sin(-th), ax=p[0]-o[0], ay=p[1]-o[1];
  return [ax*c-ay*s, ax*s+ay*c]; }
function geometry(){ const out=[];
  S.rooms.forEach((room,ri)=>{ if(!room.pts.length) return;
    const pts=room.pts.map(r=>tf(r.p)), closed=room.closed && pts.length>2, segs=[];
    for(let i=0;i<pts.length-1;i++) segs.push([pts[i],pts[i+1]]);
    if(closed) segs.push([pts[pts.length-1], pts[0]]);
    out.push({ri, pts, segs, closed}); });
  return out; }
function roomHeight(g){ if(!g.closed) return null;
  const near = q => inside(q,g.pts) || g.pts.some((_,i)=>dist2(q, proj(q,g.pts[i],g.pts[(i+1)%g.pts.length]))<150);
  const hs=S.ceil.filter(c=>near(tf(c.p))).map(c=>c.h); return hs.length? hs.reduce((a,b)=>a+b,0)/hs.length : null; }
function openingGeom(o, allsegs){ let a=tf(o.a), b=tf(o.b);
  if(allsegs.length){ const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    let best=null, bd=1e18; for(const sg of allsegs){ const d=dist2(mid, proj(mid,sg[0],sg[1])); if(d<bd){bd=d; best=sg;} }
    a=proj(a,best[0],best[1]); b=proj(b,best[0],best[1]); }
  return [a,b]; }
const olabel = (i,o) => (o.kind==="window"?"F":"P") + S.open.slice(0,i+1).filter(x=>x.kind===o.kind).length;
const plabel = (ri,i,multi) => multi ? (ri+1)+"."+(i+1) : String(i+1);
const stationXY = s => tf([s.t[0], s.t[1], 0]);
const hstrum = () => { const v=parseFloat(String(S.hvar).replace(",", ".")); return isNaN(v)?null:v; };
const f2 = x => x.toFixed(2), f3 = x => x.toFixed(3);

/* ---------- feedback: lampeggio, suono, vibrazione ---------- */
let actx=null, soundOn=true;
try{ soundOn = localStorage.getItem("distoSound")!=="0"; }catch(e){}
document.addEventListener("pointerdown", ()=>{ try{
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); else if(actx.state==="suspended") actx.resume(); }catch(e){} }, true);
function beep(f, ms, delay){ if(!actx||!soundOn) return; try{
  const t=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
  o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+ms/1000+0.03); }catch(e){} }
function pulse(kind){ const hc=$("hintCard"); hc.classList.remove("flash-ok","flash-bad"); void hc.offsetWidth; hc.classList.add(kind==="ok"?"flash-ok":"flash-bad"); }
function soundLabel(){ $("bSound").textContent = soundOn ? "🔊 Suono: sì" : "🔇 Suono: no"; }

/* ---------- messaggi ---------- */
function ok(t){ const e=$("status"); e.textContent=t; e.className="ok"; }
function warn(t){ const e=$("status"); e.textContent=t; e.className="bad"; pulse("bad"); beep(330,160); beep(260,220,0.2); try{ navigator.vibrate&&navigator.vibrate([80,60,80]); }catch(e){} }
function info(t){ const e=$("status"); e.textContent=t; e.className=""; }
function measured(){ pulse("ok"); beep(1320,90); try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){} }

/* ---------- modalità ---------- */
function setMode(m){ mode=m; document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on", b.dataset.m===m)); }
function cancelStation(){ if(stat){ stat=null; undo=undo.filter(k=>k[0]!=="sref"); $("bStation").textContent="Nuova stazione"; $("bSkip").disabled=true; } }
function onMode(m){ cancelStation(); partial=null; undo=undo.filter(k=>k[0]!=="partial"); setMode(m); setHint(); refresh(); }
function setHint(){ let t; const n=S.stations.length;
  if(stat) t="STAZIONE "+(n+1)+" — punta il RIFERIMENTO R"+(stat.k+1)+" ("+(stat.k+1)+" di "+S.refs.length+"). Con almeno 2 puoi premere «Calcola stazione».";
  else if(mode==="plan"){ const cur=S.rooms[S.rooms.length-1];
    if(cur.closed||!cur.pts.length) t="PIANTA · STANZA "+(S.rooms.length+(cur.closed?1:0))+" — punta il primo spigolo (anche in alto: va a quota 0)";
    else t="PIANTA · STANZA "+S.rooms.length+" — punto "+(cur.pts.length+1)+": punta lo spigolo successivo"; }
  else if(mode==="refs") t="RIFERIMENTI — punta un punto FISSO, visibile anche da altre posizioni (R"+(S.refs.length+1)+"). Minimo 2, meglio 3 ben distanziati.";
  else if(HINTS[mode]) t=HINTS[mode];
  else t=(mode==="window"?WSTEPS:DSTEPS)[partial?partial.steps.length:0];
  $("hint").textContent=t; $("stlabel").textContent="Stazione S"+n; $("stlabelTop").textContent="· S"+n; }

/* ---------- stazioni ---------- */
function stationBtn(){
  if(stat){ finishStation(); return; }
  if(S.refs.length<2){ warn("Prima servono almeno 2 riferimenti: usa «Riferimenti» e punta 2-3 punti fissi."); return; }
  partial=null; undo=undo.filter(k=>k[0]!=="partial"); stat={k:0, meas:[]}; setMode("");
  $("bStation").textContent="Calcola stazione"; $("bSkip").disabled=false;
  ok("Sposta il Disto e mettilo in bolla sulla base. Poi punta i riferimenti nell'ordine."); setHint(); refresh(); }
function skipRef(){ if(!stat) return; stat.k++; if(stat.k>=S.refs.length) finishStation(); else setHint(); }
function statMeasure(pl){
  if(stat.k>=S.refs.length){ warn("Hai già misurato tutti i riferimenti: premi «Calcola stazione»."); return; }
  stat.meas.push([stat.k, pl]); undo.push(["sref"]); ok("Riferimento R"+(stat.k+1)+" misurato dalla nuova posizione."); measured(); stat.k++;
  if(stat.k>=S.refs.length) finishStation(); else { setHint(); refresh(); } }
function finishStation(){
  if(stat.meas.length<2){ warn("Servono almeno 2 riferimenti misurati dalla nuova posizione."); return; }
  const sol=solveStation(stat.meas.map(([i,pl])=>[pl, S.refs[i]]));
  stat=null; undo=undo.filter(k=>k[0]!=="sref"); S.stations.push(sol); undo.push(["station"]);
  $("bStation").textContent="Nuova stazione"; $("bSkip").disabled=true; setMode("plan");
  const mx=Math.max(...sol.res); let msg="Stazione "+S.stations.length+" calcolata con "+sol.res.length+" riferimenti. Scarto massimo "+mx.toFixed(0)+" mm.";
  if(sol.res.length===2) msg+=" (con 2 riferimenti non c'è controllo: meglio 3)";
  if(mx>15) warn(msg+" ATTENZIONE: scarto alto, controlla di aver puntato gli stessi punti («Annulla» per rifare)."); else ok(msg+" Puoi continuare a misurare.");
  setHint(); refresh(); }

/* ---------- misure ---------- */
function onMeasure(m){
  const pl=toXYZ(m);
  if(stat){ statMeasure(pl); return; }
  const p=apply(pl), H=hstrum();
  if(mode==="plan"){
    if(S.rooms[S.rooms.length-1].closed) S.rooms.push(newRoom());
    const r=S.rooms[S.rooms.length-1]; r.pts.push({p, d:m.d}); undo.push(["room", S.rooms.length-1]);
    ok("Stanza "+S.rooms.length+" · punto "+r.pts.length+" registrato ("+f3(m.d)+" m)"); }
  else if(mode==="refs"){ S.refs.push(p); undo.push(["ref"]); ok("Riferimento R"+S.refs.length+" registrato. Ne servono almeno 2 (meglio 3)."); }
  else if(mode==="floor"){ S.hvar=f3(-p[2]/1000); $("hvar").value=S.hvar; ok("Altezza strumento da terra = "+S.hvar+" m"); }
  else if(H===null){ warn("Prima serve l'altezza dello strumento: usa «Pavimento» (punta il pavimento) o scrivila sotto la pianta."); return; }
  else if(mode==="ceil"){ const h=p[2]/1000+H; S.ceil.push({p, h}); undo.push(["ceil"]); ok("Altezza soffitto = "+f3(h)+" m"); }
  else openingStep(mode, p, H);
  measured(); setHint(); refresh(); ensureVisible(p); }
function openingStep(kind, p, H){

let view={x:0,y:0,z:1}, lastT=null;
const isDefaultView = () => view.z===1 && view.x===0 && view.y===0;
function resetView(){ view={x:0,y:0,z:1}; }
function zoomAt(m, f){ const cv=$("cv"), W=cv.clientWidth, Hh=cv.clientHeight;
  const nz=Math.max(0.3, Math.min(60, view.z*f)); f=nz/view.z;
  view.x = m[0]-W/2-(m[0]-W/2-view.x)*f; view.y = m[1]-Hh/2-(m[1]-Hh/2-view.y)*f; view.z=nz; }
function ensureVisible(p){ if(!lastT || isDefaultView()) return; const cv=$("cv"), [x,y]=lastT(tf(p));

(function gestures(){
  const cv=$("cv"), ptrs=new Map(); let pinch=null, down=null, lastTap=0;
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener("pointerdown", e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(x){} ptrs.set(e.pointerId,pos(e)); pinch=null;
    down = ptrs.size===1 ? {p:pos(e), t:Date.now(), moved:false} : null; });
  cv.addEventListener("pointermove", e=>{ if(!ptrs.has(e.pointerId)) return; const prev=ptrs.get(e.pointerId), cur=pos(e); ptrs.set(e.pointerId,cur);

      if(!down || down.moved){ view.x+=cur[0]-prev[0]; view.y+=cur[1]-prev[1]; redraw(); } }
    else if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];

/* ---------- disegno ---------- */
const C = { line:"#f3f3f5", cur:"#ff5c5f", fill:"rgba(229,56,59,.12)", dim:"#ffb020", area:"#ff8a8c", pt:"#f3f3f5", origin:"#ff4d4f",
  win:"#4fb3ff", door:"#d39b5f", ceil:"#c084fc", ref:"#ffb020", st:"#4ade80", stOld:"#7a7a85", halo:"#101014", muted:"#9a9aa5" };
function label(c, t, x, y, col, font, align){ c.font=font; c.textAlign=align||"center"; c.lineJoin="round";
  c.strokeStyle=C.halo; c.lineWidth=4; c.strokeText(t,x,y); c.fillStyle=col; c.fillText(t,x,y); }
function redraw(){
  const cv=$("cv"), dpr=window.devicePixelRatio||1, W=cv.clientWidth, Hh=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(Hh*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(Hh*dpr); }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,Hh);
  $("bFit").hidden = isDefaultView();
  const geo=geometry(), allsegs=geo.flatMap(g=>g.segs), multi=geo.length>1;
  const og=S.open.map(o=>openingGeom(o,allsegs)), sxy=S.stations.map(stationXY), rxy=S.refs.map(tf);
  let all=[...geo.flatMap(g=>g.pts), ...og.flat(), ...S.ceil.map(k=>tf(k.p)), ...sxy, ...rxy];
  if(partial) all=all.concat(partial.steps.slice(0,2).map(tf));
  c.textBaseline="middle";
  if(!all.length){ lastT=null; c.fillStyle=C.muted; c.font="16px system-ui"; c.textAlign="center";
    c.fillText("Collega il Disto e misura i punti.", W/2, Hh/2-12); c.fillText("Punto 1 = origine, lato 1-2 = asse X.", W/2, Hh/2+12); return; }
  const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  const bw=Math.max(Math.max(...xs)-Math.min(...xs),500), bh=Math.max(Math.max(...ys)-Math.min(...ys),500);
  const sc=Math.min((W-90)/bw,(Hh-90)/bh)*view.z, cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2;

      label(c, f3(dist2(a,b)/1000), (x1+x2)/2, (y1+y2)/2-12, C.dim, "bold 13px system-ui"); }
    if(g.closed){ const gx=g.pts.reduce((a,p)=>a+p[0],0)/g.pts.length, gy=g.pts.reduce((a,p)=>a+p[1],0)/g.pts.length, [x,y]=T([gx,gy]), rh=roomHeight(g);
      label(c, "S"+(g.ri+1)+"  "+f2(areaM2(g.pts))+" m²", x, y-(rh?9:0), C.area, "bold 15px system-ui"); if(rh) label(c, "H "+f2(rh), x, y+11, C.area, "bold 14px system-ui"); } }
  S.open.forEach((o,i)=>{ const [a,b]=og[i], [x1,y1]=T(a), [x2,y2]=T(b), col=o.kind==="window"?C.win:C.door;
    c.strokeStyle=col; c.lineWidth=8; c.lineCap="round"; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.lineCap="butt";
    let t=olabel(i,o)+" "+f2(dist2(a,b)/1000)+" × "+f2(o.top-o.sill); if(o.kind==="window") t+="  (p. "+f2(o.sill)+")";
    label(c, t, (x1+x2)/2, (y1+y2)/2+18, col, "bold 12px system-ui"); });
  for(const g of geo) g.pts.forEach((p,i)=>{ const [x,y]=T(p), first=g.ri===0&&i===0, last=g.ri===curRi&&i===g.pts.length-1;
    if(last){ c.strokeStyle=C.cur; c.lineWidth=2.5; c.beginPath(); c.arc(x,y,11,0,7); c.stroke(); }
    c.fillStyle=first?C.origin:C.pt; c.beginPath(); c.arc(x,y,first?6:5,0,7); c.fill();
    label(c, plabel(g.ri,i,multi), x+14, y-14, first?C.origin:C.pt, "bold 14px system-ui"); });
  for(const k of S.ceil){ const [x,y]=T(tf(k.p)); c.fillStyle=C.ceil; c.fillRect(x-4,y-4,8,8); label(c, "h "+f2(k.h), x+8, y+15, C.ceil, "bold 12px system-ui", "left"); }
  rxy.forEach((r,i)=>{ const [x,y]=T(r); c.fillStyle=C.ref; c.strokeStyle="#000"; c.lineWidth=1.5; c.beginPath(); c.moveTo(x,y-8); c.lineTo(x+8,y); c.lineTo(x,y+8); c.lineTo(x-8,y); c.closePath(); c.fill(); c.stroke();
    label(c, "R"+(i+1), x+12, y+14, C.ref, "bold 13px system-ui", "left"); });
  sxy.forEach((s,i)=>{ const [x,y]=T(s), col=i===sxy.length-1?C.st:C.stOld; c.fillStyle=col; c.strokeStyle="#000"; c.lineWidth=1.5; c.beginPath(); c.moveTo(x,y-11); c.lineTo(x+10,y+8); c.lineTo(x-10,y+8); c.closePath(); c.fill(); c.stroke();

}

      it.push(["T","DISTO_STANZE",gx,gy,120,"S"+(g.ri+1)+" A="+f2(areaM2(g.pts))+" m2"+(rh?" H="+f2(rh):"")]); } }

  S.open.forEach((o,i)=>{ const [a,b]=openingGeom(o,allsegs), lay=o.kind==="window"?"DISTO_FINESTRE":"DISTO_PORTE";
    it.push(["L",lay,a[0],a[1],b[0],b[1]]);
    it.push(["T",lay,(a[0]+b[0])/2,(a[1]+b[1])/2-150,70,olabel(i,o)+" L="+f2(dist2(a,b)/1000)+" H="+f2(o.top-o.sill)+(o.kind==="window"?" P="+f2(o.sill):"")]); });
  [["DISTO_STAZIONI","ST",S.stations.map(stationXY)],["DISTO_RIFERIMENTI","R",S.refs.map(tf)]].forEach(([lay,pre,pts])=>pts.forEach(([x,y],i)=>{
    it.push(["L",lay,x-100,y,x+100,y]); it.push(["L",lay,x,y-100,x,y+100]); it.push(["T",lay,x+120,y+60,100,pre+(i+1)]); }));
  const o=["0","SECTION","2","HEADER","9","$ACADVER","1","AC1009","0","ENDSEC","0","SECTION","2","ENTITIES"], n=v=>v.toFixed(3);

/* ---------- Bluetooth ---------- */
let dev=null, chars={}, rspResolve=null, pending={}, timer=null;
function parseAng(dv){ if(dv.byteLength<12) return; const cnt=dv.getUint8(10), p=pending[cnt]||(pending[cnt]={t:Date.now()}); p.h=dv.getFloat32(0,true); p.z=dv.getFloat32(4,true); complete(cnt); }
function parseDst(dv){ if(dv.byteLength<20) return; const cnt=dv.getUint8(18), p=pending[cnt]||(pending[cnt]={t:Date.now()}); p.d=dv.getFloat32(0,true); p.inc=dv.getFloat32(4,true); complete(cnt); }
function complete(cnt){ const m=pending[cnt]; if(m && ["h","z","d","inc"].every(k=>k in m)){ delete pending[cnt]; onMeasure(m); } }
function send(text){ return new Promise(res=>{
  const to=setTimeout(()=>{ rspResolve=null; res(""); },5000);
  rspResolve=v=>{ clearTimeout(to); res(v); };
  chars["120"].writeValueWithResponse(new TextEncoder().encode(text+"\r\n")).catch(()=>{ clearTimeout(to); rspResolve=null; res(""); }); }); }
function connUI(on){ const b=$("bConn"); b.classList.toggle("on", on); b.textContent = on ? "Collegato" : "Collega Disto"; }
function onDisconnected(){ connUI(false); clearInterval(timer); warn("Disto SCOLLEGATO. Premi «Collega Disto» per ricollegarlo: il rilievo resta salvato."); }
async function setup(){
  info("Mi collego al Disto..."); const server=await dev.gatt.connect(), svc=await server.getPrimaryService(SERVICE); chars={};
  for(const n of ENABLE){ const ch=await svc.getCharacteristic(U(n)); chars[n]=ch;
    ch.addEventListener("characteristicvaluechanged", e=>{ const dv=e.target.value;
      if(n==="10f") parseAng(dv); else if(n==="10d") parseDst(dv);
      else if(n==="121"){ const t=new TextDecoder().decode(dv).trim(); if(rspResolve){ const r=rspResolve; rspResolve=null; r(t); } } });
    await ch.startNotifications(); }
  chars["120"]=await svc.getCharacteristic(U("120"));
  await send("getSoftwareVersion app"); await send("getDiscoStatus"); await send("raiseEvent 100"); const lvl=await send("getLevelStatus");
  connUI(true); keepAwake();
  ok("Collegato. Premi il tasto di misura sul Disto."+(lvl.endsWith("1")?"":"  (livello base non confermato)")); beep(880,90); beep(1320,120,0.12);
  clearInterval(timer);
  timer=setInterval(()=>{ const now=Date.now(); for(const k of Object.keys(pending)){ const m=pending[k];
    if(now-m.t>3000){ if("d" in m && !("h" in m)) warn("Arrivata solo la distanza ("+f3(m.d)+" m), senza angoli: misura NON registrata. Controlla la bolla e riprova."); delete pending[k]; } } },500);
}
async function connect(all){
  if(!navigator.bluetooth){ warn("Questo browser non supporta il Bluetooth web. Sul PC usa Chrome o Edge, sull'iPhone l'app Bluefy."); return; }
  if(dev && dev.gatt.connected){ if(confirm("Scollegare il Disto?")) dev.gatt.disconnect(); return; }
  try{
    if(dev && !all){ try{ await setup(); return; }catch(e){ info("Ricollegamento diretto non riuscito, cerco il Disto..."); } }
    info("Scelgo il dispositivo...");
    dev = await navigator.bluetooth.requestDevice(all? {acceptAllDevices:true, optionalServices:[SERVICE]} : {filters:[{namePrefix:"DISTO"}], optionalServices:[SERVICE]});
    dev.addEventListener("gattserverdisconnected", onDisconnected);
    await setup();
  }catch(e){ connUI(false); warn("Errore: "+(e&&e.message?e.message:e)+(String(e).includes("cancel")?"":"  — se non lo trova: spegni e riaccendi il Disto e riprova.")); }
}

/* ---------- demo ---------- */
function demo(){ const meas=(x,y,z)=>{ const d=Math.sqrt(x*x+y*y+z*z)/1000; return {d, z:Math.acos(z/1000/d), h:-Math.atan2(y,x), inc:0}; };
  clearAll(); S.hvar="1.5"; $("hvar").value="1.5"; onMode("plan");
  [[-2000,-1500],[2000,-1500],[2000,1500],[-2000,1500]].forEach(([x,y])=>onMeasure(meas(x,y,1200))); toggleClose();
  onMode("ceil"); onMeasure(meas(-2000,-1500,1200)); onMode("window");
  [[-500,-1500,-600],[500,-1500,-600],[0,-1500,-600],[0,-1500,-100]].forEach(p=>onMeasure(meas(...p)));
  onMode("door"); [[2000,-500,-1500],[2000,300,-1500],[2000,0,600]].forEach(p=>onMeasure(meas(...p))); onMode("plan");
  info("Demo caricata: stanza 4 × 3 m con altezza, una finestra e una porta."); }

/* ---------- avvio ---------- */
MODES.forEach(([k,t,sub])=>{ const b=document.createElement("button"); b.dataset.m=k; b.innerHTML=t+"<small>"+sub+"</small>"; b.onclick=()=>onMode(k); $("modes").appendChild(b); });
const sheet=$("sheet"), openSheet=()=>{ sheet.hidden=false; }, closeSheet=()=>{ sheet.hidden=true; };
$("bMenu").onclick=openSheet; $("bSheetClose").onclick=closeSheet; sheet.addEventListener("click", e=>{ if(e.target===sheet) closeSheet(); });
const fromSheet = fn => () => { closeSheet(); fn(); };
$("bConn").onclick=()=>connect(false); $("bAll").onclick=fromSheet(()=>connect(true));
$("bUndo").onclick=undoLast; $("bClose").onclick=toggleClose; $("bRoom").onclick=newRoomBtn;
$("bDxf").onclick=fromSheet(exportDxf); $("bSave").onclick=fromSheet(saveFile); $("bOpen").onclick=fromSheet(()=>$("fileIn").click());
$("bClear").onclick=fromSheet(clearAll); $("bDemo").onclick=fromSheet(demo);
$("bSound").onclick=()=>{ soundOn=!soundOn; try{ localStorage.setItem("distoSound", soundOn?"1":"0"); }catch(e){} soundLabel(); if(soundOn) beep(1320,90); };
$("bStation").onclick=stationBtn; $("bSkip").onclick=skipRef; $("bFit").onclick=()=>{ resetView(); redraw(); };
$("fileIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ loadObj(JSON.parse(await f.text())); ok("Rilievo aperto: "+f.name); }catch(x){ warn("File non valido."); } e.target.value=""; };
$("hvar").oninput=e=>{ S.hvar=e.target.value; refresh(); };
window.addEventListener("resize", redraw);
if(window.innerWidth>=900) $("dati").open=true;
soundLabel();
try{ const raw=localStorage.getItem("distoRilievo"); if(raw){ const d=JSON.parse(raw); if(d.rooms && d.rooms.some(r=>r.pts.length)) { loadObj(d); ok("Ripristinato l'ultimo rilievo."); } } }catch(e){}
setMode("plan"); setHint(); refresh();
window.disto={onMeasure, onMode, stationBtn, toggleClose, undoLast, newRoomBtn, buildDxf, get S(){return S;}, demo, clearAll, get view(){return view;}};
</script>
</body>
</html>
